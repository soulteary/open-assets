name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.14.4
      - run: ruff check open_assets scripts tests && ruff format --check open_assets scripts tests
      - run: python -m unittest discover -s tests -v
      - run: node --check open_assets/static/app.js && node --test tests/test_storage_ui.js
      - run: docker build -t open-assets:test .
