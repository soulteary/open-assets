name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.14.4
      - run: ruff check open_assets scripts tests && ruff format --check open_assets scripts tests
      - run: python -m unittest discover -s tests -v
      - run: node --check open_assets/static/app.js && node --test tests/test_storage_ui.js
      - run: docker build -t open-assets:test .
  fresh-stack:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt bcrypt
      - name: Prepare disposable deployment directory
        run: |
          test ! -e /app/open-assets
          test ! -e /data/asset-stack
          sudo mkdir -p /app/open-assets
          sudo cp -a . /app/open-assets/
      - name: Initialize, publish, and verify anonymous and authenticated access
        run: sudo env PATH="$PATH" OPEN_ASSETS_FRESH_TEST=1 OPEN_ASSETS_COMMUNITY_TEST=1 sh /app/open-assets/tests/e2e/fresh-stack.sh
      # private/ contains credentials. Never upload it as a workflow artifact.
