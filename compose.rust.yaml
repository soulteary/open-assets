# Opt-in migration candidate. Existing production Compose remains unchanged until
# cross-language and fresh-stack acceptance has passed.
services:
  publisher:
    image: open-assets:rust
    build:
      context: .
      dockerfile: Dockerfile.rust
    entrypoint: [/usr/local/bin/open-assets]
    healthcheck:
      test: [CMD, /usr/local/bin/open-assets, health, publisher]
  webhook:
    image: open-assets:rust
    build:
      context: .
      dockerfile: Dockerfile.rust
    entrypoint: [/usr/local/bin/open-assets]
    healthcheck:
      test: [CMD, /usr/local/bin/open-assets, health, webhook]
  info:
    image: open-assets:rust
    entrypoint: [/usr/local/bin/open-assets, info]
    healthcheck:
      test: [CMD, /usr/local/bin/open-assets, health, info]
  object-reader:
    image: open-assets:rust
    entrypoint: [/usr/local/bin/open-assets, object-reader]
    healthcheck:
      test: [CMD, /usr/local/bin/open-assets, health, object-reader]
  object-cleaner:
    image: open-assets:rust
    entrypoint: [/usr/local/bin/open-assets, object-retention]
