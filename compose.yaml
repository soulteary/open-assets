name: asset-stack
x-app: &app
  image: open-assets:local
  build: .
  user: '20010:20010'
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs: ['/tmp:size=128m']
  environment: &appenv
    OPEN_ASSETS_CONFIG: /config/repositories.yaml
    S3_ACCESS_KEY_FILE: /run/private/publisher_access
    S3_SECRET_KEY_FILE: /run/private/publisher_secret
    S3_CA_FILE: /run/private/ca.crt
    WEBHOOK_SECRET_FILE: /run/private/webhook_secret
    GIT_SSH_COMMAND: ssh -i /run/private/deploy_key -o UserKnownHostsFile=/run/private/known_hosts -o StrictHostKeyChecking=yes
  networks: [git, publish]
services:
  webhook:
    <<: *app
    command: [serve]
    volumes: ['./private/repositories.yaml:/config/repositories.yaml:ro','./private/webhook_secret:/run/private/webhook_secret:ro','${DATA_ROOT}/publisher:/state']
  publisher:
    <<: *app
    command: [worker]
    volumes: ['./private/repositories.yaml:/config/repositories.yaml:ro','./private/publisher:/run/private:ro','${DATA_ROOT}/publisher:/state','${DATA_ROOT}/images:/images']
  nginx:
    image: ${NGINX_IMAGE}
    user: '20010:20010'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    entrypoint: [nginx]
    command: ['-c','/etc/nginx/open-assets.conf','-g','daemon off;']
    volumes: ['./config/nginx.conf:/etc/nginx/open-assets.conf:ro','./private/generated:/etc/nginx/generated:ro','${DATA_ROOT}/images:/srv/images:ro']
    tmpfs: ['/tmp:size=32m']
    networks: [edge]
  otterio:
    image: ${OTTERIO_IMAGE}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:size=128m']
    user: '20002:20002'
    restart: unless-stopped
    command: [server,--address,':9000',--console-address,':9001',--certs-dir,/tls,/data]
    environment:
      HOME: /tmp
      OTTERIO_BROWSER: 'off'
      OTTERIO_ROOT_USER_FILE: /run/private/root_user
      OTTERIO_ROOT_PASSWORD_FILE: /run/private/root_password
    volumes: ['${DATA_ROOT}/otterio:/data','./private/storage:/run/private:ro','./private/tls/storage:/tls:ro']
    networks:
      publish:
        aliases: [storage.internal]
      edge: {}
      admin:
        aliases: [storage.internal]
    ports: ['127.0.0.1:19000:9000','127.0.0.1:19001:9001']
  oc:
    image: ${OC_IMAGE}
    user: '20004:20004'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:size=64m']
    restart: unless-stopped
    entrypoint: [oc-console]
    command: [--auth-mode,native,--address,'0.0.0.0:9090',--public-url,'https://${STORAGE_DOMAIN}',--s3-url,'https://storage.internal:9000',--admin-url,'https://storage.internal:9001',--s3-ca,/tls/ca.crt,--admin-ca,/tls/ca.crt,--tls-cert,/tls/console.crt,--tls-key,/tls/console.key,--data-dir,/app-data,--archive-dir,/archives,--allow-writes]
    volumes: ['./private/tls/console:/tls:ro','${DATA_ROOT}/console:/app-data','${DATA_ROOT}/archives:/archives']
    networks: [edge, admin]
  stargate:
    image: ${STARGATE_IMAGE}
    restart: unless-stopped
    env_file: ./private/stargate.env
    networks:
      auth:
        ipv4_address: 172.29.19.3
    ports: ['127.0.0.1:18080:8080']
  gitea:
    image: ${GITEA_IMAGE}
    user: '20001:20001'
    restart: unless-stopped
    environment:
      GITEA__server__DOMAIN: ${GIT_DOMAIN}
      GITEA__server__ROOT_URL: https://${GIT_DOMAIN}/
      GITEA__server__SSH_DOMAIN: ${GIT_DOMAIN}
      GITEA__server__SSH_PORT: '2222'
      GITEA__server__SSH_LISTEN_PORT: '2222'
      GITEA__server__START_SSH_SERVER: 'true'
      GITEA__server__DISABLE_SSH: 'false'
      GITEA__server__LFS_START_SERVER: 'false'
      GITEA__security__INSTALL_LOCK: 'true'
      GITEA__service__DISABLE_REGISTRATION: 'true'
      GITEA__webhook__ALLOWED_HOST_LIST: webhook
      GITEA__security__DISABLE_WEBHOOKS: 'false'
      GITEA__security__DISABLE_GIT_HOOKS: 'true'
      GITEA__actions__ENABLED: 'false'
      GITEA__database__DB_TYPE: sqlite3
    volumes: ['${DATA_ROOT}/gitea/data:/var/lib/gitea','${DATA_ROOT}/gitea/config:/etc/gitea']
    ports: ['2222:2222','127.0.0.1:13000:3000']
    networks: [edge, git]
networks:
  edge:
    name: open-assets-edge
  auth:
    name: open-assets-auth
    ipam:
      config: [{subnet: 172.29.19.0/24}]
  git: {}
  publish: {}
  admin:
    internal: true
