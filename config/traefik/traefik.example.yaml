global:
  checkNewVersion: false
  sendAnonymousUsage: false
  aliasHeadersStrategy: delete
entryPoints:
  web:
    address: ':8080'
    http:
      redirections:
        entryPoint:
          to: ':443'
          scheme: https
  websecure:
    address: ':8443'
  ping:
    address: ':8082'
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
api:
  dashboard: true
  insecure: false
ping:
  entryPoint: ping
certificatesResolvers:
  le:
    acme:
      # Replace with your own reachable email address before starting Traefik.
      email: replace-me@example.org
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web
log:
  level: INFO
