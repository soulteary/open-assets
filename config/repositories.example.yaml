schema_version: 1
state_root: /state
images_root: /images
bucket: attachments
endpoint: http://otterio:9000
# Cleanup is opt-in. Per-repository retention values override these defaults.
retention:
  enabled: false
  keep_last: 5
  keep_days: 30
  min_age_hours: 24
  rollback_versions: 2
  pinned_shas: []
  archive_jobs_after_days: 30
  max_delete_versions: 10
  max_delete_bytes: 268435456
  max_archive_jobs: 100
repositories:
  - key: main-images
    repository_id: 1
    name: content/images
    remote: ssh://git@gitea:2222/content/images.git
    branch: main
    enabled: true
    source_directory: public
    mount_path: /
    max_files: 10000
    max_bytes: 1073741824
    max_file_bytes: 104857600
