schema_version: 1
state_root: /state
images_root: /images
bucket: attachments
endpoint: http://otterio:9000
# Global admission budgets. All values are positive integers; bytes are logical.
# Omitted keys use these defaults. Git virtual-memory limits apply on Linux.
resource_limits:
  git_repository_bytes: 2147483648
  git_total_bytes: 8589934592
  git_fetch_bytes: 536870912
  git_min_free_bytes: 536870912
  git_timeout_seconds: 120
  git_process_memory_bytes: 536870912
  git_output_bytes: 8388608
  scan_entries: 200000
  queue_active_records: 1000
  queue_total_records: 10000
  queue_reserved_bytes: 1073741824
# Cleanup is opt-in. Per-repository retention values override these defaults.
retention:
  enabled: false
  keep_last: 5
  keep_days: 30
  min_age_hours: 24
  rollback_versions: 2
  pinned_shas: []
  archive_jobs_after_days: 30
  max_delete_versions: 10
  max_delete_bytes: 268435456
  max_archive_jobs: 100
# Separate object retention: preview by default; never inherits local enabled.
object_retention:
  enabled: false
  exclusive_writer: false
  keep_last: 10
  keep_days: 90
  min_age_hours: 24
  pinned_shas: []
  max_delete_versions: 2
  max_delete_objects: 100
  max_delete_bytes: 268435456
repositories:
  - key: main-images
    repository_id: 1
    name: content/images
    remote: ssh://git@gitea:2222/content/images.git
    branch: main
    enabled: true
    source_directory: public
    mount_path: /
    max_files: 10000
    max_bytes: 1073741824
    max_file_bytes: 104857600
